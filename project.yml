name: BackTunes

options:
  bundleIdPrefix: com.backtunes
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.backtunes.app
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  BackTunes:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BackTunes
    info:
      path: BackTunes/Info.plist
    settings:
      base:
        PRODUCT_NAME: BackTunes

schemes:
  BackTunes:
    build:
      targets:
        BackTunes: all
    run:
      config: Debug
